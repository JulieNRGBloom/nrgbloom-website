<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NRG Bloom cover template</title>
<style>
  @font-face{font-family:"Switzer";src:url("../../fonts/Switzer-Variable.woff2") format("woff2");font-weight:100 900;font-display:block}
  @font-face{font-family:"Inter Tight";src:url("../../fonts/InterTight-VariableFont_wght.woff2") format("woff2");font-weight:100 900;font-display:block}

  :root{
    --navy:#0f172a;
    --brand:#14489b;
    --accent:#5b9bf0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:675px;overflow:hidden}
  body{
    font-family:"Inter Tight","Switzer",system-ui,sans-serif;
    background:var(--navy);
    position:relative;
  }

  /* background photo, optional */
  #photo{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    display:none;
  }
  /* gradient keeps the left side readable over any photo */
  #scrim{
    position:absolute;inset:0;
    background:linear-gradient(100deg,
      rgba(15,23,42,0.97) 0%,
      rgba(15,23,42,0.93) 38%,
      rgba(15,23,42,0.55) 62%,
      rgba(15,23,42,0.25) 100%);
  }
  /* when there is no photo, use a brand gradient instead of flat navy */
  body.nophoto #scrim{
    background:radial-gradient(1200px 700px at 88% 15%, rgba(20,72,155,0.55) 0%, rgba(15,23,42,0) 62%),
               linear-gradient(120deg,#0f172a 0%,#0f172a 55%,#122c57 100%);
  }

  .wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:center}
  .col{max-width:660px}

  .kicker{
    font-size:19px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--accent);
  }
  .rule{width:54px;height:3px;background:var(--accent);margin:14px 0 26px;border-radius:2px}

  h1{
    font-family:"Switzer","Inter Tight",system-ui,sans-serif;
    font-size:68px;line-height:1.04;font-weight:800;color:#fff;
    letter-spacing:-0.022em;
  }
  h1.long{font-size:56px}
  h1.xlong{font-size:47px;line-height:1.08}

  .sub{
    margin-top:24px;font-size:25px;line-height:1.38;font-weight:400;
    color:#cbd5e1;max-width:600px;
  }
  .src{
    position:absolute;left:72px;bottom:58px;
    font-size:15px;color:#94a3b8;letter-spacing:.01em;
  }
  .logo{position:absolute;right:68px;bottom:52px;width:168px;opacity:.95}
</style>
</head>
<body class="nophoto">
  <div id="photo"></div>
  <div id="scrim"></div>
  <div class="wrap">
    <div class="col">
      <div class="kicker" id="k"></div>
      <div class="rule"></div>
      <h1 id="h"></h1>
      <div class="sub" id="s"></div>
    </div>
  </div>
  <div class="src" id="c"></div>
  <img class="logo" src="../../images/White.webp" alt="">

<script>
  var q = new URLSearchParams(location.search);
  function set(id, val){ document.getElementById(id).textContent = val || ""; }

  set("k", q.get("kicker"));
  set("h", q.get("headline"));
  set("s", q.get("subtitle"));
  set("c", q.get("source"));

  // scale the headline down as it gets longer so it always fits the box
  var h = document.getElementById("h");
  var len = (q.get("headline") || "").length;
  if (len > 58) h.className = "xlong";
  else if (len > 34) h.className = "long";

  var photo = q.get("photo");
  if (photo) {
    document.body.classList.remove("nophoto");
    var p = document.getElementById("photo");
    p.style.display = "block";
    p.style.backgroundImage = 'url("' + photo + '")';
  }

  // hide the empty subtitle block so spacing stays tight
  if (!q.get("subtitle")) document.getElementById("s").style.display = "none";

  document.documentElement.setAttribute("data-ready", "1");
</script>
</body>
</html>
